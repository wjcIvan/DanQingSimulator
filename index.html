<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>丹青模拟器 Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card-box {
            height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            overflow: hidden;
            transition: transform 0.1s, box-shadow 0.2s;
        }
        .card-box.selected { border-color: #ef4444; background-color: #fef2f2; border-top-width: 4px; box-shadow: 0 8px 20px rgba(239, 68, 68, 0.1); }
        .accent-red { accent-color: #ef4444; }

        /* 种族视觉标识 */
        .race-human { border-top: 4px solid #3b82f6; }
        .race-beast { border-top: 4px solid #f59e0b; }
        .race-tool { border-top: 4px solid #10b981; }
        .tag-human { background-color: #eff6ff; color: #1e40af; }
        .tag-beast { background-color: #fffbeb; color: #92400e; }
        .tag-tool { background-color: #ecfdf5; color: #065f46; }

        /* 布局控制 */
        .race-section {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .race-title {
            grid-column: 1 / -1;
            font-size: 1rem;
            font-weight: 800;
            color: #64748b;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #f1f5f9;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        /* 右侧结果卡片 */
        .metric-card { background: white; padding: 1.25rem; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 1rem; }
        .metric-label { font-size: 0.75rem; color: #64748b; font-weight: bold; margin-bottom: 0.25rem; }
        .metric-value { font-size: 1.875rem; font-weight: 900; color: #ef4444; line-height: 1; }

        /* 预期范围条样式 */
        .range-container {
            background: #fdf2f2;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #fee2e2;
            margin-top: 1rem;
        }
        .range-bar-bg {
            height: 6px;
            background: #fee2e2;
            border-radius: 99px;
            position: relative;
            margin-top: 8px;
        }
        .range-bar-fill {
            position: absolute;
            background: #ef4444;
            opacity: 0.6;
            height: 100%;
            border-radius: 99px;
            transition: all 0.5s ease;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

    <header class="bg-white px-8 py-4 sticky top-0 z-10 flex justify-between items-center">
        <h1 class="text-xl font-black text-red-600">🎴 丹青模拟器 Pro</h1>
        <div class="flex gap-4">
            <button onclick="reset()" class="text-sm font-bold text-slate-400 hover:text-red-500">清空阵容</button>
            <button onclick="doSim()" class="bg-red-500 text-white px-6 py-2 rounded-full font-bold hover:bg-red-600 transition-all shadow-lg shadow-red-200">🔥 开始演算</button>
        </div>
    </header>

    <div class="flex flex-col lg:flex-row gap-6 p-6 max-w-[1600px] mx-auto">

        <div class="flex-1 lg:w-3/5">

            <div class="bg-white p-6 rounded-3xl shadow-sm mb-6 grid grid-cols-2 md:grid-cols-4 gap-6">
                <div>
                    <label class="block text-[15px] font-bold text-slate-400 uppercase mb-1">基础攻击(无丹青)</label>
                    <input type="number" id="baseAtk" value="8000" class="w-full border-b font-bold py-1 outline-none focus:border-red-400">
                </div>
                <div>
                    <label class="block text-[15px] font-bold text-slate-400 uppercase mb-1">初始秒伤(无丹青)</label>
                    <input type="number" id="baseDps" value="35000" class="w-full border-b font-bold py-1 outline-none focus:border-red-400">
                </div>
                <div>
                    <label class="block text-[15px] font-bold text-slate-400 uppercase mb-1">战斗时长: <span id="timeVal">300</span>s</label>
                    <input type="range" id="simTime" min="30" max="600" value="300" class="w-full accent-red">
                </div>
                <div>
                    <label class="block text-[15px] font-bold text-slate-400 uppercase mb-1">迭代次数: <span id="iterVal">50</span></label>
                    <input type="range" id="simIter" min="1" max="200" value="50" class="w-full accent-red">
                </div>
            </div>

            <div class="flex justify-between items-center mb-4 px-2">
                <h2 class="font-bold text-slate-700">阵容编成 <span id="feeLabel" class="ml-2 text-sm font-bold text-green-500">0 / 25 费</span></h2>
                <div class="flex gap-2">
                    <button onclick="batchSetStars(0)" class="text-[12px] bg-white border px-2 py-1 rounded shadow-sm hover:bg-slate-50">全员 0★</button>
                    <button onclick="batchSetStars(1)" class="text-[12px] bg-white border px-2 py-1 rounded shadow-sm hover:bg-slate-50">1★</button>
                    <button onclick="batchSetStars(2)" class="text-[12px] bg-white border px-2 py-1 rounded shadow-sm hover:bg-slate-50">2★</button>
                    <button onclick="batchSetStars(3)" class="text-[12px] bg-white border px-2 py-1 rounded shadow-sm hover:bg-slate-50">3★</button>
                    <button onclick="batchSetStars(4)" class="text-[12px] bg-white border px-2 py-1 rounded shadow-sm hover:bg-slate-50">4★</button>
                    <button onclick="batchSetStars(5)" class="text-[12px] bg-white border px-2 py-1 rounded shadow-sm hover:bg-slate-50">5★</button>
                    <button onclick="batchSetStars(6)" class="text-[12px] bg-white border px-2 py-1 rounded shadow-sm hover:bg-slate-50">6★</button>
                </div>
            </div>

            <div id="cardGrid"></div>
        </div>

        <div class="w-full lg:w-[450px] xl:w-[500px] space-y-6">

            <section>
                <h2 class="font-bold text-slate-500 mb-4 flex items-center gap-2">
                    <span class="w-1 h-4 bg-red-500 rounded-full"></span> 📊 模拟报告
                </h2>

                <div class="metric-card shadow-sm">
                    <div class="metric-label">当前DPS</div>
                    <div id="resTotal" class="metric-value">0</div>
                    <div id="resPercent" class="text-xs font-bold text-green-500 mt-2">+0.0%</div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-4 rounded-xl">
                        <div class="text-[12px] font-bold text-slate-400 uppercase">丹青技能伤害</div>
                        <div id="resCardDps" class="text-lg font-black text-slate-700">0</div>
                    </div>
                    <div class="bg-white p-4 rounded-xl">
                        <div class="text-[12px] font-bold text-slate-400 uppercase">丹青属性增益</div>
                        <div id="resBoostDps" class="text-lg font-black text-slate-700">0</div>
                    </div>
                </div>
                <div id="rangeInfo" class="range-container hidden">
                    <div class="flex justify-between text-[10px] text-red-800 font-bold">
                        <span>最低: <span id="resMin">0</span></span>
                        <span>预期波动: ±<span id="resErr">0</span></span>
                        <span>最高: <span id="resMax">0</span></span>
                    </div>
                    <div class="range-bar-bg">
                        <div id="rangeBar" class="range-bar-fill" style="left: 0%; width: 0%;"></div>
                    </div>
                    <p class="text-[9px] text-slate-400 mt-2 text-center italic">基于 95% 置信区间</p>
                </div>
                <div id="dpsChartInfo" class="bg-white p-4 rounded-xl mt-4 h-[250px] hidden">
                    <div class="text-[10px] font-bold text-slate-400 uppercase mb-2">DPS 演进曲线 (平均值)</div>
                    <canvas id="dpsChart"></canvas>
                </div>
            </section>

            <section>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="font-bold text-slate-500 flex items-center gap-2">
                        <span class="w-1 h-4 bg-slate-400 rounded-full"></span> 📜 历史记录
                    </h2>
                    <button onclick="clearHistory()" class="text-[10px] text-blue-500">清空</button>
                </div>
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden text-xs">
                    <div class="max-h-[400px] overflow-y-auto" id="historyList">
                        <div class="p-8 text-center text-slate-300">暂无模拟数据</div>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <script src="engine.js"></script>
    <script>
        let selected = new Map();

        const races = ["Human", "Beast", "Tool"];
        const raceConfig = {
            "Human": { border: "race-human", tag: "tag-human", title: "人"  },
            "Beast": { border: "race-beast", tag: "tag-beast", title: "兽"  },
            "Tool": { border: "race-tool", tag: "tag-tool", title: "器"  }
        };

        const CARDS = window.CARD_DATABASE;

        let dpsChartInstance = null;

        function init() {
            const grid = document.getElementById('cardGrid');

            grid.innerHTML = races.map(race => {
                const raceCards = CARDS.filter(c => c.race === race);
                const conf = raceConfig[race];
                return `
                    <div class="race-section">
                        ${raceCards.map(c => `
                            <div id="c-${c.className}" class="card-box p-4 rounded-2xl bg-white shadow-sm ${conf.border}" onclick="toggle('${c.className}')">
                                <div class="flex justify-between items-start mb-1">
                                    <span class="font-bold text-slate-700">${c.name}</span>
                                    <span class="text-[12px] bg-slate-100 px-1.5 py-0.5 rounded text-slate-500 font-mono">${c.fee}F</span>
                                </div>
                                <div class="flex mb-3"><div class="text-[12px] px-2 py-0.5 rounded-full font-black ${conf.tag}">${conf.title}</div></div>
                                <div id="star-ui-${c.className}" class="star-ui hidden" onclick="event.stopPropagation()">
                                    <div class="flex items-center gap-2">
                                        <input type="range" min="0" max="6" value="6" class="flex-1 accent-red h-1" oninput="updateLv('${c.className}', this.value)">
                                        <span class="text-[10px] font-black text-red-500 w-4"><span id="lv-${c.className}">6</span>★</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }).join('');
        }

        function toggle(name) {
            const node = document.getElementById(`c-${name}`);
            const starUi = document.getElementById(`star-ui-${name}`);
            if(selected.has(name)) {
                selected.delete(name);
                node.classList.remove('selected');
                starUi.classList.add('hidden');
            } else {
                selected.set(name, { name, level: 6 });
                node.classList.add('selected');
                starUi.classList.remove('hidden');
            }
            updateFee();
        }

        function updateLv(name, val) {
            if(selected.has(name)) {
                selected.get(name).level = parseInt(val);
                document.getElementById(`lv-${name}`).innerText = val;
            }
        }

        function updateFee() {
            let total = 0;
            selected.forEach(v => {
                const info = CARDS.find(c => c.className === v.name);
                total += info.fee;
            });
            const label = document.getElementById('feeLabel');
            label.innerText = `${total} / 25 费`;
            label.className = total > 25 ? "ml-2 text-sm font-bold text-red-500" : "ml-2 text-sm font-bold text-green-500";
        }


        function doSim() {
            if(selected.size === 0) return alert("请先选卡");
            const deckClasses = [];
            selected.forEach((val, key) => {
                // 从数据库中找到对应的类引用
                const cardMeta = CARDS.find(c => c.className === key);
                if (cardMeta) {
                    // 动态创建实例，传入等级
                    deckClasses.push(new cardMeta.classRef(val.level));
                }
            });

            const baseAtk = parseInt(document.getElementById('baseAtk').value);
            const baseDps = parseInt(document.getElementById('baseDps').value);
            const simTime = parseInt(document.getElementById('simTime').value);
            const iterations = parseInt(document.getElementById('simIter').value);

            let results = [];
            for(let i = 0; i < iterations; i++) {
                const engine = new RaceCombatEngine(deckClasses, baseAtk, baseDps);
                results.push(engine.simulate(simTime));
            }

            // 统计计算
            const totals = results.map(r => r.total);
            const avgTotal = totals.reduce((a, b) => a + b, 0) / iterations;
            const avgCard = results.reduce((a, b) => a + b.card_dps, 0) / iterations;
            const avgBoost = results.reduce((a, b) => a + b.boost_dps, 0) / iterations;

            const minVal = Math.min(...totals);
            const maxVal = Math.max(...totals);

            // 计算标准差和 95% 置信区间 (CI = 1.96 * std / sqrt(n))
            const stdDev = Math.sqrt(totals.map(x => Math.pow(x - avgTotal, 2)).reduce((a, b) => a + b) / iterations);
            const ci95 = 1.96 * (stdDev / Math.sqrt(iterations));

            // 更新 UI
            document.getElementById('resTotal').innerText = Math.round(avgTotal).toLocaleString();
            document.getElementById('resCardDps').innerText = Math.round(avgCard).toLocaleString();
            document.getElementById('resBoostDps').innerText = Math.round(avgBoost).toLocaleString();

            const increaseDps = Math.round(avgTotal - baseDps).toLocaleString();
            document.getElementById('resPercent').innerText = `相比无丹青提升 +${((avgTotal - baseDps)/baseDps*100).toFixed(1)}% (${increaseDps})`;

            // 更新波动范围条
            document.getElementById('rangeInfo').classList.remove('hidden');
            document.getElementById('dpsChartInfo').classList.remove('hidden');
            document.getElementById('resMin').innerText = Math.round(minVal).toLocaleString();
            document.getElementById('resMax').innerText = Math.round(maxVal).toLocaleString();
            document.getElementById('resErr').innerText = Math.round(ci95).toLocaleString();

            // 渲染进度条位置
            const rangePercent = ((2 * ci95) / (maxVal - minVal + 1)) * 100;
            const leftPercent = ((avgTotal - ci95 - minVal) / (maxVal - minVal + 1)) * 100;
            document.getElementById('rangeBar').style.left = Math.max(0, leftPercent) + "%";
            document.getElementById('rangeBar').style.width = Math.min(100, rangePercent) + "%";

            addHistory(Math.round(avgTotal), ci95);

            // 计算平均 DPS 曲线 ---
            const historyLength = results[0].dpsHistory.length;
            let averageCurve = new Array(historyLength).fill(0);

            for (let i = 0; i < historyLength; i++) {
                let sum = 0;
                for (let j = 0; j < iterations; j++) {
                    sum += results[j].dpsHistory[i];
                }
                averageCurve[i] = Math.round(sum / iterations);
            }
            renderChart(averageCurve, simTime);
        }

        function renderChart(curveData, totalTime) {
            const ctx = document.getElementById('dpsChart').getContext('2d');
            if (dpsChartInstance) dpsChartInstance.destroy();

            // 生成 X 轴标签 (1s, 2s, ...)
            const labels = curveData.map((_, i) => (i + 1) + 's');

            dpsChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '平均 DPS',
                        data: curveData,
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.05)',
                        borderWidth: 2,
                        pointRadius: 0,
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: {
                            left: 10,
                            right: 20,
                            top: 10,
                            bottom: 10
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: { mode: 'index', intersect: false }
                    },
                    scales: {
                        x: { display: true, grid: { display: false }, ticks: { maxTicksLimit: 10 } },
                        y: { beginAtZero: false, grid: { color: '#f1f5f9' } }
                    }
                }
            });
        }

        function addHistory(dps, error) {
            const list = document.getElementById('historyList');
            if (list.innerText.includes("暂无")) list.innerHTML = '';

            const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});

            // 处理阵容文字 (默认 6 星不显示星级)
            const lineup = Array.from(selected.values()).map(card => {
                const chineseName = window.CARD_NAME_MAP[card.name] || card.name;
                return card.level === 6 ? chineseName : `${chineseName}(${card.level}★)`;
            }).join(" + ");

            const item = `
                <div class="p-3 border-b hover:bg-slate-50 transition-colors bg-white rounded-xl mb-1 border border-slate-100">
                    <div class="flex justify-between items-center mb-1">
                        <div class="flex items-center gap-2">
                            <span class="text-sm font-black text-red-500">${dps.toLocaleString()}</span>
                            <span class="text-[9px] text-slate-400 font-bold">±${Math.round(error).toLocaleString()}</span>
                        </div>
                        <span class="text-[9px] text-slate-300 font-mono">${time}</span>
                    </div>
                    <div class="text-[10px] text-slate-500 truncate">${lineup}</div>
                </div>
            `;
            list.insertAdjacentHTML('afterbegin', item);
        }

        function clearHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '<div class="p-8 text-center text-slate-300">暂无模拟数据</div>';
        }

        function batchSetStars(s) {
            selected.forEach((v, k) => {
                v.level = s;
                document.getElementById(`lv-${k}`).innerText = s;
                document.querySelector(`#star-ui-${k} input`).value = s;
            });
        }

        function reset() { selected.clear(); init(); updateFee(); }

        document.getElementById('simTime').oninput = function() { document.getElementById('timeVal').innerText = this.value; };
        document.getElementById('simIter').oninput = function() { document.getElementById('iterVal').innerText = this.value; };

        init();
    </script>
</body>

</html>
